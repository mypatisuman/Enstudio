[package]
name = "enstudio"
version = "0.1.0"
description = "enSTUDIO — P&ID digitisation desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
rusqlite          = { version = "0.31", features = ["bundled"] }
ureq              = { version = "2", features = ["json"] }
sha2              = "0.10"
bcrypt            = "0.15"
tauri-plugin-dialog = "2"
base64              = "0.22"
lettre              = { version = "0.11.0", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
rand                = "0.8"
