[project]
name = "studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "ezdxf>=1.3",
    "fastapi>=0.111.0",
    "flask>=3.0.0",
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    # Detection is vision-LLM only: no torch / torchvision /
    # ultralytics / rapidocr-onnxruntime anywhere in the loop.
    # OpenCV is classical image handling, not machine learning.
    "rich>=13.0.0",
    "scikit-image>=0.22.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph>=1.1,<2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.5",
    "pymongo>=4.6.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[tool.pyright]
extraPaths = ["."]
