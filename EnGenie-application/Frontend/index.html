<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Favicon (replace vite.svg with your actual logo) -->
  <link rel="icon" type="image/png" href="/favicon-round.png" />
  <link rel="shortcut icon" href="/favicon-round.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-round.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ✅ Primary Meta Tags -->
  <title>Copilot</title>
  <meta name="title" content="Engineering Copilot - AI-Powered Industrial Product Selection" />
  <meta name="description"
    content="Engineering Copilot helps industries find the right products instantly using advanced AI-powered recommendations. Save time, reduce errors, and improve efficiency." />
  <meta name="author" content="Engineering Copilot" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />

  <!-- ✅ Fonts (your existing setup is good) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <!-- Fallback for no-JS -->
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- ✅ Open Graph (Facebook, LinkedIn previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Engineering Copilot - AI-Powered Industrial Product Recommendations" />
  <meta property="og:description"
    content="Helps industries find the right products instantly using advanced AI-powered recommendations." />
  <meta property="og:site_name" content="Copilot" />
  <meta property="og:locale" content="en_US" />

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Engineering Copilot - AI-Powered Industrial Product Recommendations" />
  <meta name="twitter:description"
    content="Helps industries find the right products instantly using advanced AI-powered recommendations." />

  <!-- ✅ Structured Data / Schema Markup -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Engineering Copilot",
        "description": "AI-powered industrial product recommendation system"
      }
    </script>

  <!-- ✅ Web App Schema (since it's a web app) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Engineering Copilot",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Advanced AI-powered industrial product recommendation system",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

</head>

<body class="app-gradient min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
