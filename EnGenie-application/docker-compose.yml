# ── EnGenie — Full-stack Docker Compose ──────────────────────────────────────
#
# Services:
#   backend   – Flask/Gunicorn API           → http://localhost:5000
#   frontend  – React/Vite (nginx)           → http://localhost:80
#
# External dependencies (provided via Backend/.env):
#   - MongoDB Atlas (MONGODB_URI)
#   - Azure Cache for Redis (REDIS_URL)
#   - Azure MySQL (DATABASE_URL)
#   - Azure Blob Storage (AZURE_STORAGE_*)
#   - LLM API keys (ANTHROPIC_API_KEY, OPEN_API_KEY, GOOGLE_API_KEY)
#
# Usage:
#   docker compose up --build          # first run / after code changes
#   docker compose up -d               # background
#   docker compose down                # stop and remove containers
#   docker compose logs -f backend     # tail backend logs

services:
  # ── Flask/Gunicorn Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: engenie-backend:latest
    container_name: engenie-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    volumes:
      # Persist logs outside the container
      - backend_logs:/app/logs
    networks:
      - engenie-net

  # ── React/Vite Frontend (nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: engenie-frontend:latest
    container_name: engenie-frontend
    ports:
      - "80:80"
    # Pass public env vars at build time via ARGs if needed; runtime values
    # are baked in by Vite during `npm run build`, so no env_file required here.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - engenie-net

volumes:
  backend_logs:

networks:
  engenie-net:
    driver: bridge
